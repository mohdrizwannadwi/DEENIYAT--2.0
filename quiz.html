<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f8f3;

    font-family:
    "Noto Nastaliq Urdu",

.header{
    background:#086b3c;

    text-align:center;

}

.header h1{
    margin:0;
    color:#ffd800;
    font-size:32px;
}

.container{
    max-width:850px;

    padding:20px 15px;
}

.quiz-card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);

.question-number{
    color:#769b20;
    font-size:20px;

}

.question{
    font-size:25px;

}

.option{
    width:100%;

    border:2px solid #ddd;
    background:#fff;
    color:#222;
    border-radius:12px;
    padding:12px 15px;
    margin:10px 0;
    text-align:right;
    font-size:19px;
    cursor:pointer;
    font-family:inherit;
}

.option:hover{
    border-color:#769b20;
}

.option.correct{
    background:#dff4df;
    border-color:#218838;
}

.option.wrong{
    background:#ffe0e0;
    border-color:#dc3545;
}

.reference{
    display:none;
    background:#f4f8f3;
    border-right:5px solid #769b20;
    border-radius:10px;
    padding:12px;
    margin-top:18px;
    font-size:17px;
}

.next-btn{
    display:none;
    margin:20px auto 0;
    border:0;
    border-radius:10px;
    padding:10px 25px;
    background:#086b3c;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-family:inherit;
}

.score{
    text-align:center;
    font-size:25px;
    color:#086b3c;
    font-weight:bold;
}

.restart{
    display:none;
    margin:15px auto;
    border:0;
    border-radius:10px;
    padding:10px 25px;
    background:#769b20;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-family:inherit;
}

footer{
    margin-top:40px;
    background:#086b3c;
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>

<body>

<header class="header">

<h1>📝 اسلامی Quiz</h1>

<p>DEENIYAT 2.0</p>

</header>


<main class="container">

<div class="quiz-card">

<div class="question-number" id="questionNumber">
سوال 1 / 100
</div>

<div class="question" id="question">
سوال یہاں آئے گا
</div>

<div id="options"></div>

<div class="reference" id="reference"></div>

<button class="next-btn" id="nextBtn" onclick="nextQuestion()">
اگلا سوال
</button>

<div class="score" id="score"></div>

<button class="restart" id="restartBtn" onclick="restartQuiz()">
دوبارہ شروع کریں
</button>

</div>

</main>


<footer>

© 2026 DEENIYAT 2.0

</footer>

],
answer:1,

}

];


/* باقی سوالات بعد میں اسی format میں شامل ہوں گے */

let currentQuestion = 0;
let score = 0;
let answered = false;


const questionNumber =
document.getElementById("questionNumber");

const question =
document.getElementById("question");

const options =
document.getElementById("options");

const reference =
document.getElementById("reference");

const nextBtn =
document.getElementById("nextBtn");

const scoreBox =
document.getElementById("score");

const restartBtn =
document.getElementById("restartBtn");


function loadQuestion(){

    answered = false;

    const q = questions[currentQuestion];

    questionNumber.innerText =
    "سوال " + (currentQuestion + 1) +
    " / " + questions.length;

    question.innerText = q.question;

    options.innerHTML = "";

    reference.style.display = "none";

    reference.innerText = q.reference;

    nextBtn.style.display = "none";

    q.options.forEach(function(optionText,index){

        const button =
        document.createElement("button");

        button.className = "option";

        button.innerText = optionText;

        button.onclick = function(){

            selectAnswer(button,index);

        };

        options.appendChild(button);

    });

}


function selectAnswer(button,index){

    if(answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const allOptions =
    document.querySelectorAll(".option");

    allOptions.forEach(function(btn,i){

        if(i === q.answer){

            btn.classList.add("correct");

        }

    });


    if(index === q.answer){

        score++;

    }else{

        button.classList.add("wrong");

    }


    reference.style.display = "block";

    nextBtn.style.display = "block";

}


function nextQuestion(){

    currentQuestion++;

    if(currentQuestion < questions.length){

        loadQuestion();

    }else{

        showResult();

    }

}


function showResult(){

    questionNumber.innerText = "";

    question.innerText =
    "🎉 Quiz مکمل ہوگیا!";

    options.innerHTML = "";

    reference.style.display = "none";

    nextBtn.style.display = "none";

    scoreBox.innerText =
    "آپ کا اسکور: " +
    score +
    " / " +
    questions.length;

    restartBtn.style.display = "block";

}


function restartQuiz(){

    currentQuestion = 0;

    score = 0;

    scoreBox.innerText = "";

    restartBtn.style.display = "none";

    loadQuestion();

}


loadQuestion();

</script>
