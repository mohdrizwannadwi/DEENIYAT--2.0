<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اسلامی Quiz | DEENIYAT 2.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f8f3;
  color: #222;
  font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
}

.header {
  background: #086b3c;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

.header h1 {
  margin: 0;
  color: #ffd800;
  font-size: 34px;
}

.header p {
  margin: 8px 0 0;
  font-family: serif;
  font-size: 22px;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px 15px;
}

.quiz-card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  margin-top: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.question-number {
  color: #668f21;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.question {
  font-size: 27px;
  font-weight: bold;
  line-height: 2;
  margin-bottom: 20px;
}

.options {
  display: grid;
  gap: 12px;
}

.option {
  width: 100%;
  border: 2px solid #086b3c;
  background: white;
  color: #086b3c;
  padding: 13px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 20px;
  cursor: pointer;
  text-align: right;
}

.option:hover {
  background: #e9f5ee;
}

.option.correct {
  background: #b8e6c8;
  border-color: #16833f;
  color: #075b28;
}

.option.wrong {
  background: #ffd0d0;
  border-color: #d33;
  color: #a00;
}

#nextBtn {
  display: none;
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: #086b3c;
  color: white;
  font-family: inherit;
  font-size: 21px;
  cursor: pointer;
}

#nextBtn:hover {
  background: #07572f;
}

.result {
  display: none;
  text-align: center;
  font-size: 25px;
  line-height: 2;
}

.restart {
  background: #086b3c;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 20px;
}

.footer {
  margin-top: 40px;
  background: #086b3c;
  color: white;
  text-align: center;
  padding: 20px;
  font-family: serif;
  font-size: 20px;
}
</style>
</head>

<body>

<header class="header">
  <h1>Quiz اسلامی 📝</h1>
  <p>DEENIYAT 2.0</p>
</header>

<main class="container">

  <div class="quiz-card" id="quizBox">

    <div class="question-number" id="questionNumber">
      سوال 1 / 10
    </div>

    <div class="question" id="question">
      سوال یہاں آئے گا
    </div>

    <div class="options" id="options"></div>

    <button id="nextBtn">اگلا سوال ➜</button>

  </div>

  <div class="quiz-card result" id="resultBox">
    <h2>🎉 Quiz مکمل ہوگیا!</h2>

    <div id="scoreText"></div>

    <br>

    <button class="restart" onclick="restartQuiz()">
      دوبارہ شروع کریں
    </button>
  </div>

</main>

<footer class="footer">
  DEENIYAT 2.0 2026 ©
</footer>


<!-- JavaScript ہمیشہ style کے باہر -->
<script>

const questions = [

  {
    question: "اسلام کے کتنے ارکان ہیں؟",
    options: ["3", "4", "5", "6"],
    answer: 2
  },

  {
    question: "قرآن مجید کس نبی ﷺ پر نازل ہوا؟",
    options: [
      "حضرت موسیٰ علیہ السلام",
      "حضرت عیسیٰ علیہ السلام",
      "حضرت محمد ﷺ",
      "حضرت ابراہیم علیہ السلام"
    ],
    answer: 2
  },

  {
    question: "قرآن مجید میں کتنی سورتیں ہیں؟",
    options: ["110", "114", "120", "124"],
    answer: 1
  },

  {
    question: "اسلام کی پہلی مسجد کون سی ہے؟",
    options: [
      "مسجد نبوی",
      "مسجد الحرام",
      "مسجد قباء",
      "مسجد اقصیٰ"
    ],
    answer: 2
  },

  {
    question: "نماز دن میں کتنی مرتبہ فرض ہے؟",
    options: ["3", "4", "5", "6"],
    answer: 2
  },

  {
    question: "رمضان المبارک میں کون سی عبادت فرض ہے؟",
    options: ["زکوٰۃ", "روزہ", "حج", "قربانی"],
    answer: 1
  },

  {
    question: "مسلمانوں کا قبلہ کیا ہے؟",
    options: [
      "مسجد نبوی",
      "خانہ کعبہ",
      "مسجد اقصیٰ",
      "مسجد قباء"
    ],
    answer: 1
  },

  {
    question: "اسلامی سال کا پہلا مہینہ کون سا ہے؟",
    options: [
      "رمضان",
      "محرم",
      "شوال",
      "رجب"
    ],
    answer: 1
  },

  {
    question: "زکوٰۃ اسلام کا کون سا رکن ہے؟",
    options: ["پہلا", "دوسرا", "تیسرا", "چوتھا"],
    answer: 2
  },

  {
    question: "حج کس اسلامی مہینے میں ادا کیا جاتا ہے؟",
    options: [
      "رمضان",
      "شوال",
      "ذوالقعدہ",
      "ذوالحجہ"
    ],
    answer: 3
  }

];


let currentQuestion = 0;
let score = 0;
let answered = false;


const questionNumber =
  document.getElementById("questionNumber");

const question =
  document.getElementById("question");

const options =
  document.getElementById("options");

const nextBtn =
  document.getElementById("nextBtn");

const quizBox =
  document.getElementById("quizBox");

const resultBox =
  document.getElementById("resultBox");

const scoreText =
  document.getElementById("scoreText");


function loadQuestion() {

  answered = false;

  const q = questions[currentQuestion];

  questionNumber.innerText =
    "سوال " + (currentQuestion + 1)
    + " / " + questions.length;

  question.innerText = q.question;

  options.innerHTML = "";

  nextBtn.style.display = "none";


  q.options.forEach(function(optionText, index) {

    const button =
      document.createElement("button");

    button.className = "option";

    button.innerText = optionText;

    button.onclick = function() {
      selectAnswer(button, index);
    };

    options.appendChild(button);

  });

}


function selectAnswer(button, index) {

  if (answered) {
    return;
  }

  answered = true;

  const correctAnswer =
    questions[currentQuestion].answer;

  const allOptions =
    document.querySelectorAll(".option");


  if (index === correctAnswer) {

    button.classList.add("correct");

    score++;

  } else {

    button.classList.add("wrong");

    allOptions[correctAnswer]
      .classList.add("correct");

  }


  allOptions.forEach(function(btn) {
    btn.disabled = true;
  });


  nextBtn.style.display = "block";
}


nextBtn.onclick = function() {

  currentQuestion++;

  if (currentQuestion < questions.length) {

    loadQuestion();

  } else {

    showResult();

  }

};


function showResult() {

  quizBox.style.display = "none";

  resultBox.style.display = "block";

  scoreText.innerHTML =
    "آپ کا اسکور: <strong>"
    + score
    + " / "
    + questions.length
    + "</strong>";

}


function restartQuiz() {

  currentQuestion = 0;

  score = 0;

  resultBox.style.display = "none";

  quizBox.style.display = "block";

  loadQuestion();

}


// Quiz شروع کریں
loadQuestion();

</script>

</body>
</html>
