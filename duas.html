function showDuas(){

  const container = document.getElementById("duas");

  container.innerHTML = "";

  duas.forEach((dua,index)=>{

    const div = document.createElement("div");

    div.className = "dua";

    div.innerHTML = `
      <h2>${dua.title}</h2>

      <div class="arabic">
        ${dua.arabic}
      </div>

      <div class="urdu">
        ${dua.urdu}
      </div>

      <div class="reference">
        ${dua.ref}
      </div>

      <div class="buttons">

        <button class="copy"
          onclick="copyDua(${index},this)">
          📋 حدیث/دعا کاپی کریں
        </button>

        <button class="share"
          onclick="shareDua(${index})">
          📤 شیئر کریں
        </button>

      </div>

      <div class="msg" id="msg${index}"></div>
    `;

    container.appendChild(div);

  });

}

function getDuaText(index){

  const d = duas[index];

  return `${d.title}

${d.arabic}

${d.urdu}

${d.ref}`;

}

function copyDua(index,button){

  const text = getDuaText(index);

  navigator.clipboard.writeText(text).then(()=>{

    button.innerText = "✅ کاپی ہوگئی";

    setTimeout(()=>{
      button.innerText = "📋 حدیث/دعا کاپی کریں";
    },2000);

  }).catch(()=>{

    alert("کاپی نہیں ہو سکی۔");

  });

}

function shareDua(index){

  const text = getDuaText(index);

  if(navigator.share){

    navigator.share({
      title: duas[index].title,
      text:text
    });

  }else{

    navigator.clipboard.writeText(text);

    document.getElementById("msg"+index).innerText =
      "✅ دعا کاپی ہوگئی، اب آپ اسے کہیں بھی شیئر کر سکتے ہیں۔";

    setTimeout(()=>{
      document.getElementById("msg"+index).innerText="";
    },3000);

  }

}

showDuas();
