<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مسنون دعائیں - DEENIYAT 2.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #0b5d3b;
  color: white;
}

.container {
  max-width: 800px;
  margin: auto;
}

h1 {
  text-align: center;
  margin: 15px 0 5px;
}

.subtitle {
  text-align: center;
  margin-bottom: 20px;
}

.dua {
  background: white;
  color: #222;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 15px;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
}

.dua h2 {
  color: #0b5d3b;
  margin-top: 0;
}

.arabic {
  font-size: 24px;
  line-height: 2.2;
  margin: 15px 0;
}

.urdu {
  font-size: 18px;
  line-height: 2;
  margin: 15px 0;
}

.reference {
  background: #eee;
  padding: 10px;
  border-radius: 8px;
  margin-top: 12px;
  color: #333;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  cursor: pointer;
}

.copy {
  background: #0b5d3b;
  color: white;
}

.share {
  background: #1976d2;
  color: white;
}

.message {
  text-align: center;
  margin-top: 8px;
  color: #0b5d3b;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🤲 مسنون دعائیں</h1>

<div class="subtitle">
DEENIYAT 2.0
</div>

<div id="duas"></div>

</div>

<script>

const duas = [

{
title: "1۔ سونے کی دعا",
arabic: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",
urdu: "اے اللہ! تیرے ہی نام کے ساتھ مرتا اور جیتا ہوں۔",
reference: "صحیح بخاری، حدیث 6324"
},

{
title: "2۔ جاگنے کی دعا",
arabic: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",
urdu: "تمام تعریفیں اللہ کے لیے ہیں جس نے ہمیں موت کے بعد زندگی دی اور اسی کی طرف لوٹنا ہے۔",
reference: "صحیح بخاری، حدیث 6312"
},

{
title: "3۔ بیت الخلاء میں داخل ہونے کی دعا",
arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ",
urdu: "اے اللہ! میں ناپاک جنات اور شیاطین سے تیری پناہ مانگتا ہوں۔",
reference: "صحیح بخاری، حدیث 142"
},

{
title: "4۔ بیت الخلاء سے نکلنے کی دعا",
arabic: "غُفْرَانَكَ",
urdu: "اے اللہ! میں تیری بخشش چاہتا ہوں۔",
reference: "سنن ابی داود، حدیث 30"
},

{
title: "5۔ کھانے سے پہلے",
arabic: "بِسْمِ اللَّهِ",
urdu: "اللہ کے نام سے شروع کرتا ہوں۔",
reference: "سنن ابی داود، حدیث 3767"
},

{
title: "6۔ کھانے کے بعد",
arabic: "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ",
urdu: "تمام تعریفیں اللہ کے لیے ہیں جس نے مجھے یہ کھانا کھلایا اور میری کسی طاقت و قوت کے بغیر مجھے یہ رزق عطا کیا۔",
reference: "سنن ابی داود، حدیث 4023"
},

{
title: "7۔ مسجد میں داخل ہونے کی دعا",
arabic: "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ",
urdu: "اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔",
reference: "صحیح مسلم، حدیث 713"
},

{
title: "8۔ مسجد سے نکلنے کی دعا",
arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ",
urdu: "اے اللہ! میں تجھ سے تیرے فضل کا سوال کرتا ہوں۔",
reference: "صحیح مسلم، حدیث 713"
},

{
title: "9۔ گھر سے نکلنے کی دعا",
arabic: "بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
urdu: "اللہ کے نام سے، میں نے اللہ پر بھروسہ کیا۔ اللہ کے سوا نہ کوئی طاقت ہے نہ قوت۔",
reference: "سنن ابی داود، حدیث 5095؛ جامع ترمذی، حدیث 3426"
},

{
title: "10۔ علم میں اضافے کی دعا",
arabic: "رَبِّ زِدْنِي عِلْمًا",
urdu: "اے میرے رب! میرے علم میں اضافہ فرما۔",
reference: "قرآن مجید، سورۃ طٰہٰ 20:114"
}

];

function showDuas() {

const container = document.getElementById("duas");

container.innerHTML = "";

duas.forEach(function(dua, index) {

const card = document.createElement("div");

card.className = "dua";

card.innerHTML = `

<h2>${dua.title}</h2>

<div class="arabic">
${dua.arabic}
</div>

<div class="urdu">
${dua.urdu}
</div>

<div class="reference">
📚 حوالہ: ${dua.reference}
</div>

<div class="buttons">

<button class="copy"
onclick="copyDua(${index})">
📋 Copy
</button>

<button class="share"
onclick="shareDua(${index})">
📤 Share
</button>

</div>

<div id="msg${index}" class="message"></div>

`;

container.appendChild(card);

});

}

function getText(index) {

const dua = duas[index];

return `${dua.title}

${dua.arabic}

${dua.urdu}

📚 حوالہ: ${dua.reference}`;

}

function copyDua(index) {

navigator.clipboard.writeText(getText(index))
.then(function() {

document.getElementById("msg" + index)
.innerText = "✅ دعا Copy ہو گئی";

setTimeout(function() {

document.getElementById("msg" + index)
.innerText = "";

}, 2000);

});

}

function shareDua(index) {

const text = getText(index);

if (navigator.share) {

navigator.share({

title: duas[index].title,
text: text

});

} else {

navigator.clipboard.writeText(text);

document.getElementById("msg" + index)
.innerText = "✅ دعا Copy ہو گئی، اب Share کر سکتے ہیں";

setTimeout(function() {

document.getElementById("msg" + index)
.innerText = "";

}, 3000);

}

}

showDuas();

</script>

</body>
</html>
