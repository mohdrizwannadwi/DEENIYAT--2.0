<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>احادیث رسول ﷺ - DEENIYAT 2.0</title>

<!-- حدیث کا ڈیٹا -->
<script src="./hadith-data.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #0b5d3b;
  color: white;
}

.container {
  max-width: 800px;
  margin: auto;
}

h1 {
  text-align: center;
  margin: 10px 0;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  margin-bottom: 20px;
  font-size: 16px;
}

#search {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  margin-bottom: 15px;
  outline: none;
}

#status {
  text-align: center;
  margin: 15px 0;
  font-size: 16px;
}

.hadith {
  background: white;
  color: #222;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

.hadith h2 {
  margin-top: 0;
  color: #0b5d3b;
  font-size: 21px;
}

.narrator {
  background: #e8f5ef;
  color: #0b5d3b;
  padding: 10px;
  border-radius: 8px;
  margin: 10px 0;
  font-size: 17px;
  font-weight: bold;
}

.arabic {
  font-size: 24px;
  line-height: 2.2;
  text-align: right;
  margin: 15px 0;
  font-family: Arial, sans-serif;
}

.urdu {
  font-size: 19px;
  line-height: 2;
  margin: 15px 0;
}

.reference {
  background: #f1f1f1;
  color: #333;
  padding: 10px;
  border-radius: 8px;
  font-size: 15px;
}

.no-result {
  background: white;
  color: #222;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

.error {
  background: #fff;
  color: #b00020;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<h1>احادیث رسول اللہ ﷺ</h1>

<div class="subtitle">
DEENIYAT 2.0 — احادیث مبارکہ
</div>

<input
  type="text"
  id="search"
  placeholder="🔍 حدیث تلاش کریں..."
>

<div id="status">
احادیث لوڈ ہو رہی ہیں...
</div>

<div id="hadithList"></div>

</div>


<script>

function showHadith(list) {

    const container = document.getElementById("hadithList");

    container.innerHTML = "";

    if (!Array.isArray(list) || list.length === 0) {

        container.innerHTML =
        '<div class="no-result">کوئی حدیث نہیں ملی۔</div>';

        document.getElementById("status").innerText =
        "0 احادیث";

        return;
    }

    list.forEach(function(hadith) {

        const div = document.createElement("div");

        div.className = "hadith";

        div.innerHTML = `

            <h2>
                ${hadith.title || "حدیث"}
            </h2>

            ${
              hadith.narrator
              ? `
                <div class="narrator">
                    👤 ${hadith.narrator}
                </div>
              `
              : ""
            }

            <div class="arabic">
                ${hadith.arabic || ""}
            </div>

            <div class="urdu">
                ${hadith.urdu || ""}
            </div>

            <div class="reference">
                📚 حوالہ:
                ${hadith.reference || ""}
            </div>

        `;

        container.appendChild(div);

    });

    document.getElementById("status").innerText =
    list.length + " احادیث";

}


function searchHadith() {

    const searchBox = document.getElementById("search");

    const text = searchBox.value
        .trim()
        .toLowerCase();

    if (!text) {

        showHadith(hadithData);

        return;
    }

    const results = hadithData.filter(function(hadith) {

        return (

            (hadith.title || "")
                .toLowerCase()
                .includes(text)

            ||

            (hadith.narrator || "")
                .toLowerCase()
                .includes(text)

            ||

            (hadith.arabic || "")
                .toLowerCase()
                .includes(text)

            ||

            (hadith.urdu || "")
                .toLowerCase()
                .includes(text)

            ||

            (hadith.reference || "")
                .toLowerCase()
                .includes(text)

        );

    });

    showHadith(results);

}


document
.getElementById("search")
.addEventListener("input", searchHadith);


/* حدیث کا ڈیٹا چیک کریں */

if (
    typeof hadithData !== "undefined" &&
    Array.isArray(hadithData)
) {

    showHadith(hadithData);

} else {

    document.getElementById("status").innerText = "";

    document.getElementById("hadithList").innerHTML = `
        <div class="error">
            ❌ حدیث کا ڈیٹا لوڈ نہیں ہوا۔<br><br>
            چیک کریں کہ <b>hadith-data.js</b>
            اسی folder میں موجود ہے۔
        </div>
    `;

}

</script>

</body>

</html>
